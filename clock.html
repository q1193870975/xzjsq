<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f2ee">
  <title>薪时 · 实时薪资</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f3f2ee;
  --text: #242621;
  --muted: #777a71;
  --accent: #ec6a36;
  --line: #eaeae3;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 48px 26px;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%;
  max-width: 880px;
  padding: 32px 40px 23px;
  background: #fff;
  border: 1px solid #e4e4dc;
  border-radius: 24px;
  box-shadow: 0 4px 8px #33311d02, 0 24px 65px -28px #35342120;
}
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
.brand-mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  background: var(--accent);
  color: #fff;
  border-radius: 11px;
  box-shadow: 0 3px 8px #ec6a3620;
}
.brand-name { font-size: 19px; letter-spacing: 1px; font-weight: 650; }
.brand-name small { display: block; margin-top: 3px; color: #8a8d83; font-size: 7px; font-weight: 500; letter-spacing: 1.7px; }
.clock { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--muted); font-size: 10px; }
#clock { color: #45483f; font-size: 16px; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; }
.earnings { padding: 48px 8px 31px; }
.income-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 12px; font-weight: 500; color: #63675c; }
h1 span { font-size: 8px; color: #a1a498; letter-spacing: 1px; margin-left: 10px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; color: #498061; background: #eef5ef; padding: 6px 9px; border-radius: 20px; }
.status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.status.rest { background: #f3f3ef; color: #7c8172; }
.income-stage { position: relative; text-align: center; margin: 26px 0 16px; }
.income {
  color: #252a24;
  white-space: nowrap;
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: clamp(40px, 8.3vw, 112px);
  font-weight: 500;
  letter-spacing: -5px;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.currency { display: inline-block; font-size: .34em; color: #969c8d; letter-spacing: 0; vertical-align: 13px; margin-right: 10px; font-weight: 400; }
#income-decimal { color: var(--accent); font-size: .65em; letter-spacing: -3px; }
.rate { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0; color: #95998d; font-size: 11px; }
#per-second { color: #ba613a; background: #fff4ed; padding: 6px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.progress-heading { display: flex; justify-content: space-between; gap: 8px; margin-top: 35px; font-size: 11px; color: #7a8070; }
#remaining-label { color: #50594a; font-variant-numeric: tabular-nums; }
.progress-track { height: 5px; margin: 13px 0 10px; border-radius: 6px; overflow: hidden; background: #f0f0e9; }
#progress-fill { width: 0; height: 100%; border-radius: 6px; background: var(--accent); transition: width .8s linear; }
.shift-times { display: flex; justify-content: space-between; color: #94998b; font-size: 10px; font-variant-numeric: tabular-nums; }
form { display: grid; grid-template-columns: 1.25fr 1.15fr 1fr 1fr; gap: 16px; padding: 0 20px 21px; }
.settings-panel { background: #f6f6f2; border: 1px solid #eeeee7; border-radius: 13px; }
.settings-panel:not([open]) > form { display: none; }
.settings-panel .settings-close-label { display: none; }
.settings-panel[open] .settings-close-label { display: inline; }
.settings-panel[open] .settings-open-label { display: none; }
.settings-title { width: 100%; padding: 19px 20px; text-align: left; border-radius: 13px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 600; color: #4c5446; }
.settings-title > span:not(:first-child) { font-size: 10px; color: #919889; font-weight: 400; }
.field { min-width: 0; }
label { display: flex; align-items: center; gap: 5px; color: #7a8272; font-size: 10px; margin-bottom: 8px; }
label span { color: #a1a798; font-size: 9px; }
input, select {
  font: inherit;
  width: 100%;
  min-width: 0;
  height: 39px;
  padding: 0 10px;
  background: #fff;
  color: #333b2e;
  border: 1px solid #e5e8de;
  border-radius: 6px;
  outline: none;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover { border-color: #c8d0bd; }
input:focus, select:focus { border-color: #e9946f; box-shadow: 0 0 0 3px #ec6a3610; }
input[type=number] { appearance: textfield; -moz-appearance: textfield; }
input::-webkit-inner-spin-button, input::-webkit-outer-spin-button { appearance: none; margin: 0; }
input[aria-invalid=true] { border-color: #d15c42; }
.form-error { grid-column: 1 / -1; margin: 0; font-size: 11px; color: #b54c32; }
.form-error:empty { display: none; }
footer { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin: 17px 3px 0; font-size: 10px; color: #9ba18f; line-height: 1.6; }
#save-message::before { content: '✓'; color: #849d73; margin-right: 5px; }
footer > div { display: flex; gap: 17px; position: relative; }
button, summary { font: inherit; color: #7e8772; cursor: pointer; background: none; border: 0; padding: 0; white-space: nowrap; }
button:hover, summary:hover { color: #bc572c; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
summary { list-style: none; }
summary::-webkit-details-marker { display: none; }
footer details p { position: absolute; right: 0; bottom: 20px; width: 300px; max-width: calc(100vw - 64px); margin: 10px 0; padding: 17px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 35px #252a241c; color: #6e7864; font-size: 11px; line-height: 1.9; z-index: 3; }
.coin { position: absolute; left: 50%; top: 50%; color: #db7943; background: #fff5e9; border: 1px solid #f8deba; border-radius: 20px; padding: 3px 7px; font-size: 11px; pointer-events: none; animation: float-up 1.8s ease-out forwards; }
.coin::before { content: '+'; margin-right: 3px; }
@keyframes float-up { 0% { opacity: 0; transform: translate(var(--x),0); } 20% { opacity: .9; } 100% { opacity: 0; transform: translate(calc(var(--x) + 12px),-70px); } }
@media (max-width: 600px) {
  body { padding: 20px 14px; }
  main { padding: 24px 20px 18px; border-radius: 18px; }
  .brand-mark { width: 33px; height: 33px; border-radius: 9px; }
  .brand-name { font-size: 17px; }
  .brand-name small { font-size: 6px; }
  #clock { font-size: 14px; }
  #date-label { font-size: 9px; }
  .earnings { padding: 36px 0 26px; }
  h1 span { display: none; }
  .income-stage { margin: 30px 0 16px; }
  .income { font-size: clamp(26px,11vw,66px); letter-spacing: -2px; }
  .currency { vertical-align: 5px; margin-right: 5px; }
  #income-decimal { letter-spacing: -1px; }
  .rate { gap: 7px; flex-direction: column; font-size: 10px; }
  .progress-heading { margin-top: 28px; font-size: 10px; }
  .shift-times { font-size: 9px; }
  form { grid-template-columns: 1fr 1fr; padding: 0 16px 16px; gap: 17px 13px; }
  .settings-title { padding: 16px; }
  footer { font-size: 9px; gap: 12px; }
  footer > div { gap: 12px; }
  #save-message { max-width: 150px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .coin { display: none; }
}

</style>
</head>
<body>
  <main>
    <header><a class="brand" href="./"><span class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 16V12M12 16V8M19 16V4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span><span class="brand-name">薪时<small>SALARY CLOCK</small></span></a><div class="clock"><span id="date-label"></span><time id="clock">00:00:00</time></div></header>
    <section class="earnings" aria-labelledby="income-title">
      <div class="income-heading"><h1 id="income-title">今日收入 <span>TODAY’S EARNINGS</span></h1><span class="status" id="status">时钟已同步</span></div>
      <div class="income-stage"><div class="income"><span class="currency">¥</span><span id="income-whole">0</span><span id="income-decimal">.00</span></div><div id="particles" aria-hidden="true"></div></div>
      <p class="rate"><span id="per-second">+ ¥0.0000 / 秒</span><span id="income-caption">按当前时间自动累计</span></p>
      <div class="progress-heading"><span id="worked-label">已工作 0 小时 0 分钟</span><span id="remaining-label"></span></div>
      <div class="progress-track" role="progressbar" aria-label="今日工作进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
      <div class="shift-times"><span id="start-label">09:00 上班</span><span id="end-label">18:00 下班</span></div>
    </section>
    <details class="settings-panel" id="settings-panel" open><summary class="settings-title"><span>我的工作</span><span class="settings-open-label">展开设置 ⌄</span><span class="settings-close-label">收起设置 ⌃</span></summary><form id="settings-form" aria-label="薪资设置">
      <div class="field"><label for="salary">月薪 <span>元</span></label><input id="salary" type="number" min="1" max="100000000" step="0.01" required value="15000" inputmode="decimal"></div>
      <div class="field"><label for="days">每周工作</label><select id="days"><option value="1">1 天</option><option value="2">2 天</option><option value="3">3 天</option><option value="4">4 天</option><option value="5" selected>5 天 · 双休</option><option value="6">6 天 · 单休</option><option value="7">7 天 · 全勤</option></select></div>
      <div class="field"><label for="start">上班时间</label><input id="start" type="time" required value="09:00"></div>
      <div class="field"><label for="end">下班时间</label><input id="end" type="time" required value="18:00"></div>
      <p id="form-error" class="form-error" role="alert"></p>
    </form></details>
    <footer><span id="save-message" role="status">修改自动保存 · 与本地时钟同步</span><div><button id="effects" type="button" aria-pressed="true">特效 开</button><details><summary>计算说明</summary><p>月薪 ÷（每周工作天数 × 52 ÷ 12）÷ 每日工作秒数＝秒薪。工作日从周一连续排列，五天为周一至周五。按设备当前时间计算当天收入，上班前为零，下班后停在日薪，休息日为零。不计夜班，不扣午休、节假日、税费。设置仅保存在当前浏览器。</p></details></div></footer>
  </main>
  <script>
const MONTH_WEEKS = 52 / 12;
const validTime = t => typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t);
function minutes(time) {
  const [hours, mins] = time.split(':').map(Number);
  return hours * 60 + mins;
}
function validSettings(s) {
  return Boolean(s && Number.isFinite(s.salary) && s.salary >= 1 && s.salary <= 100000000 && Number.isInteger(s.days) && s.days >= 1 && s.days <= 7 && validTime(s.start) && validTime(s.end) && minutes(s.end) > minutes(s.start));
}
function rates({ salary, days, start, end }) {
  const duration = (minutes(end) - minutes(start)) * 60;
  const monthlyDays = days * MONTH_WEEKS;
  const daily = salary / monthlyDays;
  return { duration, daily, perSecond: daily / duration };
}
function dayState(settings, now = new Date()) {
  const rate = rates(settings);
  const begin = new Date(now), finish = new Date(now);
  begin.setHours(Math.floor(minutes(settings.start) / 60), minutes(settings.start) % 60, 0, 0);
  finish.setHours(Math.floor(minutes(settings.end) / 60), minutes(settings.end) % 60, 0, 0);
  const workday = (now.getDay() + 6) % 7 < settings.days;
  const elapsed = workday ? Math.max(0, Math.min(rate.duration, (now - begin) / 1000)) : 0;
  const active = workday && now >= begin && now < finish;
  const status = !workday ? '今日休息' : now < begin ? '还没上班' : now >= finish ? '已经下班' : '正在赚钱';
  return { ...rate, begin, finish, workday, elapsed, active, status, earned: elapsed * rate.perSecond };
}

const $ = id => document.getElementById(id);
const defaults = { salary: 15000, days: 5, start: '09:00', end: '18:00', effects: true };
let settings = { ...defaults };
try {
  const saved = JSON.parse(localStorage.getItem('salary-clock'));
  // Preserve salary and workweek settings from the previous hours-only version.
  const candidate = { ...defaults, ...saved };
  if (validSettings(candidate)) settings = { ...candidate, effects: candidate.effects !== false };
} catch { /* Use defaults when browser storage is unavailable. */ }
const fields = ['salary', 'days', 'start', 'end'];
const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const timeLeft = s => [Math.floor(s / 3600), Math.floor(s % 3600 / 60), Math.floor(s % 60)].map(n => String(n).padStart(2, '0')).join(':');
function fill() { for (const name of fields) $(name).value = settings[name]; }
function persist() {
  try {
    const {salary, days, start, end, effects} = settings;
    localStorage.setItem('salary-clock', JSON.stringify({salary, days, start, end, effects}));
    $('save-message').textContent = '已保存 · 与本地时钟同步';
  } catch { $('save-message').textContent = '设置已生效，当前浏览器无法保存'; }
}
function render() {
  const now = new Date(), state = dayState(settings, now);
  const [whole, decimals] = money(state.earned).split('.');
  $('income-whole').textContent = whole; $('income-decimal').textContent = `.${decimals}`;
  $('clock').textContent = now.toLocaleTimeString('zh-CN', { hour12: false });
  $('date-label').textContent = now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
  $('status').textContent = state.status; $('status').classList.toggle('rest', !state.active);
  $('per-second').textContent = `+ ¥${state.perSecond.toFixed(4)} / 秒`;
  $('income-caption').textContent = !state.workday ? '今天好好休息' : now < state.begin ? '上班后自动累计' : !state.active ? '今日辛苦了' : '按当前时间自动累计';
  $('worked-label').textContent = `已工作 ${Math.floor(state.elapsed / 3600)} 小时 ${Math.floor(state.elapsed % 3600 / 60)} 分钟`;
  $('remaining-label').textContent = !state.workday ? '休息日' : now < state.begin ? `距离上班 ${timeLeft(Math.ceil((state.begin - now) / 1000))}` : state.active ? `距离下班 ${timeLeft(Math.ceil((state.finish - now) / 1000))}` : '今日工作已结束';
  const progress = state.elapsed / state.duration * 100;
  $('progress-fill').style.width = `${progress}%`;
  document.querySelector('[role=progressbar]').setAttribute('aria-valuenow', progress.toFixed(1));
  $('start-label').textContent = `${settings.start} 上班`; $('end-label').textContent = `${settings.end} 下班`;
  $('effects').textContent = `特效 ${settings.effects ? '开' : '关'}`;
  $('effects').setAttribute('aria-pressed', String(settings.effects));
}
function updateSettings() {
  const next = { salary: Number($('salary').value), days: Number($('days').value), start: $('start').value, end: $('end').value, effects: settings.effects };
  const valid = validSettings(next) && $('settings-form').checkValidity();
  $('form-error').textContent = valid ? '' : '请输入有效月薪，并确保下班时间晚于上班时间（不计夜班）。';
  for (const name of fields) $(name).setAttribute('aria-invalid', String(!valid && (!$(name).validity.valid || (['start', 'end'].includes(name) && next.end <= next.start))));
  if (!valid) return;
  settings = next; persist(); render();
}
$('settings-form').addEventListener('change', updateSettings);
$('settings-form').addEventListener('submit', event => { event.preventDefault(); updateSettings(); });
$('effects').addEventListener('click', () => { settings.effects = !settings.effects; if (!settings.effects) $('particles').replaceChildren(); persist(); render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
window.addEventListener('storage', event => {
  if (event.key !== 'salary-clock') return;
  try {
    const saved = JSON.parse(event.newValue);
    if (validSettings(saved)) { settings = { ...defaults, ...saved }; fill(); $('form-error').textContent = ''; render(); }
  } catch { /* Ignore invalid data from another tab. */ }
});
fill(); render();
// Recompute from the wall clock each time so background tabs and reloads never drift.
setInterval(render, 100);
setInterval(() => {
  if (!settings.effects || document.hidden || matchMedia('(prefers-reduced-motion: reduce)').matches || !dayState(settings).active) return;
  const coin = document.createElement('span'); coin.className = 'coin'; coin.textContent = `¥${dayState(settings).perSecond.toFixed(4)}`;
  coin.style.setProperty('--x', `${Math.random() * 120 - 60}px`); $('particles').append(coin); setTimeout(() => coin.remove(), 1900);
}, 1000);

const settingsPanel = $('settings-panel');
try { settingsPanel.open = localStorage.getItem('salary-clock-settings-expanded') !== 'false'; }
catch { /* Native disclosure still works without browser storage. */ }
settingsPanel.addEventListener('toggle', () => {
  try { localStorage.setItem('salary-clock-settings-expanded', String(settingsPanel.open)); }
  catch { /* The native open state remains usable. */ }
});
</script>
</body>
</html>
